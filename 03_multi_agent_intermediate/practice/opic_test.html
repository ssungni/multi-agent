<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPIc TEST</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"맑은 고딕","Malgun Gothic","Segoe UI",sans-serif;background:#f0f2f5;height:100vh;overflow:hidden;}

/* ── 시작 화면 ── */
#start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff;}
.start-logo{font-size:48px;font-weight:700;color:#1a4b9a;letter-spacing:2px;margin-bottom:8px;}
.start-sub{font-size:14px;color:#666;letter-spacing:1px;margin-bottom:32px;}
.start-eva{width:220px;height:220px;object-fit:cover;border:3px solid #1a4b9a;margin-bottom:32px;}
.start-btn{padding:14px 60px;font-size:16px;font-weight:700;background:#1a4b9a;color:#fff;border:none;cursor:pointer;letter-spacing:2px;}
.start-btn:hover{background:#143d80;}

/* ── 시험 화면 ── */
#test-screen{display:none;height:100vh;flex-direction:column;background:#f0f2f5;}

/* 상단 파란 헤더 바 */
.top-bar{background:#1a4b9a;padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.top-bar-title{color:#fff;font-size:20px;font-weight:700;letter-spacing:2px;}
.top-bar-step{display:flex;align-items:center;gap:0;}

.step-item{display:flex;align-items:center;gap:6px;padding:0 16px;height:48px;background:#2a5db0;color:#cce;font-size:12px;border-right:1px solid #1a4b9a;}
.step-item.active{background:#e8821e;color:#fff;}
.step-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:2px solid rgba(255,255,255,0.5);}
.step-item.active .step-num{background:#fff;color:#e8821e;border-color:#fff;}
.step-label{line-height:1.2;}

/* 문항 진행 바 */
.progress-bar{background:#d0d8e8;padding:8px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.progress-label{font-size:12px;color:#333;font-weight:600;white-space:nowrap;}
.progress-nums{display:flex;gap:4px;flex-wrap:wrap;}
.p-num{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1px solid #aab;background:#e8eaf0;color:#555;cursor:default;}
.p-num.done{background:#888;color:#fff;border-color:#888;}
.p-num.active{background:#1a4b9a;color:#fff;border-color:#1a4b9a;}

/* 메인 영역 */
.main-area{flex:1;display:flex;gap:0;overflow:hidden;}

/* 왼쪽: EVA + 오디오 */
.left-panel{width:280px;background:#2c3a55;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-bottom:0;flex-shrink:0;}
.eva-img{width:100%;height:auto;display:block;object-fit:cover;max-height:calc(100vh - 48px - 44px - 56px);}
.audio-bar{width:100%;background:#1a2840;padding:10px 16px;display:flex;align-items:center;gap:10px;margin-top:auto;}
.play-btn{width:32px;height:32px;background:#e8821e;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.play-btn svg{width:14px;height:14px;fill:#fff;}
.audio-track{flex:1;height:4px;background:#444;position:relative;cursor:pointer;}
.audio-progress{height:100%;background:#e8821e;width:0%;transition:width 0.1s;}
.audio-hint{font-size:11px;color:#aab;letter-spacing:0.5px;}

/* 오른쪽: 문제 정보 + 질문 보기 */
.right-panel{flex:1;background:#f8f9fb;display:flex;flex-direction:column;padding:0;}

.q-header{background:#fff;border-bottom:2px solid #d0d8e8;padding:16px 24px;display:flex;align-items:center;gap:16px;}
.q-number-badge{background:#1a4b9a;color:#fff;font-size:22px;font-weight:700;padding:6px 18px;letter-spacing:1px;}
.q-title-text{font-size:15px;color:#333;font-weight:600;}
.q-sub-text{font-size:12px;color:#888;margin-top:2px;}

.q-body{flex:1;padding:24px;display:flex;flex-direction:column;gap:16px;}

/* 질문 보기 버튼 */
.reveal-btn{align-self:flex-start;padding:10px 22px;font-size:13px;font-weight:600;background:#fff;color:#1a4b9a;border:2px solid #1a4b9a;cursor:pointer;letter-spacing:0.5px;display:flex;align-items:center;gap:8px;}
.reveal-btn:hover{background:#e8eef8;}
.reveal-btn svg{width:16px;height:16px;}

/* 질문 텍스트 카드 */
#question-card{display:none;background:#fff;border:2px solid #e8821e;padding:20px 24px;}
.q-warning{font-size:11px;color:#e8821e;font-weight:600;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.q-warning::before{content:"⚠";font-size:13px;}
.q-text{font-size:18px;color:#222;line-height:1.6;font-weight:500;}

/* 하단 네비게이션 */
.bottom-nav{background:#fff;border-top:2px solid #d0d8e8;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.nav-btn{padding:10px 28px;font-size:14px;font-weight:600;border:2px solid #1a4b9a;background:#fff;color:#1a4b9a;cursor:pointer;display:flex;align-items:center;gap:8px;letter-spacing:0.5px;}
.nav-btn:hover:not(:disabled){background:#e8eef8;}
.nav-btn:disabled{opacity:0.35;cursor:not-allowed;}
.nav-btn.next-btn{background:#1a4b9a;color:#fff;}
.nav-btn.next-btn:hover:not(:disabled){background:#143d80;}
.nav-btn svg{width:14px;height:14px;}
</style>
</head>
<body>

<!-- 시작 화면 -->
<div id="start-screen">
  <div class="start-logo">OPIc</div>
  <div class="start-sub">Oral Proficiency Interview — Computer</div>
  <img class="start-eva" id="start-eva-img" src="" alt="EVA">
  <button class="start-btn" onclick="startTest()">시작하기</button>
</div>

<!-- 시험 화면 -->
<div id="test-screen">

  <!-- 상단 바 -->
  <div class="top-bar">
    <div class="top-bar-title">OPIc</div>
    <div class="top-bar-step">
      <div class="step-item">
        <div class="step-num">1</div>
        <div class="step-label">문항수<br>(7문항)</div>
      </div>
      <div class="step-item active" id="step2">
        <div class="step-num">2</div>
        <div class="step-label">질문청취<br>(2번 가능)</div>
      </div>
      <div class="step-item" id="step3">
        <div class="step-num">3</div>
        <div class="step-label">답변 녹음<br>과정 확인</div>
      </div>
      <div class="step-item" id="step4">
        <div class="step-num">4</div>
        <div class="step-label">문제 이동<br>(자동 활성화)</div>
      </div>
    </div>
  </div>

  <!-- 문항 진행 -->
  <div class="progress-bar">
    <div class="progress-label">문항 진행</div>
    <div class="progress-nums" id="progress-nums"></div>
  </div>

  <!-- 메인 -->
  <div class="main-area">

    <!-- 왼쪽: EVA -->
    <div class="left-panel">
      <img class="eva-img" id="test-eva-img" src="" alt="EVA">
      <div class="audio-bar">
        <button class="play-btn" id="play-btn" onclick="replayAudio()">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="audio-track">
          <div class="audio-progress" id="audio-progress"></div>
        </div>
        <span class="audio-hint">Click 'PLAY' button to Listen</span>
      </div>
    </div>

    <!-- 오른쪽 -->
    <div class="right-panel">
      <div class="q-header">
        <div class="q-number-badge" id="q-badge">Question 1 of 7</div>
        <div>
          <div class="q-title-text">질문을 듣고 답변을 준비하세요.</div>
          <div class="q-sub-text">아래 버튼으로 질문 텍스트를 확인할 수 있습니다 (실전에서는 제공되지 않습니다)</div>
        </div>
      </div>

      <div class="q-body">
        <button class="reveal-btn" id="reveal-btn" onclick="toggleQuestion()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          질문 보기
        </button>

        <div id="question-card">
          <div class="q-warning">실전 시험에서는 나오지 않습니다</div>
          <div class="q-text" id="q-text-content"></div>
        </div>
      </div>
    </div>

  </div><!-- /main-area -->

  <!-- 하단 네비 -->
  <div class="bottom-nav">
    <button class="nav-btn" id="btn-prev" onclick="prevQuestion()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      이전
    </button>
    <button class="nav-btn next-btn" id="btn-next" onclick="nextQuestion()">
      다음
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

</div>

<audio id="player"></audio>

document.getElementById('start-eva-img').src = EVA_SRC;
document.getElementById('test-eva-img').src = EVA_SRC;

const questions = [
  {id:1,text:"Please introduce yourself.",audio:"question/1.mp3"},
  {id:2,text:"Please describe your home in detail.",audio:"question/2.mp3"},
  {id:3,text:"What do you usually do at home during your free time?",audio:"question/3.mp3"},
  {id:4,text:"How is your current home different from the home you lived in when you were younger?",audio:"question/4.mp3"},
  {id:5,text:"What is your favorite movie? Please describe it.",audio:"question/5.mp3"},
  {id:6,text:"What do you usually do when you go to watch a movie?",audio:"question/6.mp3"},
  {id:7,text:"Tell me about the first movie that made a strong impression on you.",audio:"question/7.mp3"}
];

let current = 0;
let revealed = false;

function buildProgress(){
  const c = document.getElementById('progress-nums');
  c.innerHTML='';
  questions.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='p-num';
    d.id='pn-'+i;
    d.textContent=i+1;
    c.appendChild(d);
  });
}

function updateProgress(){
  questions.forEach((_,i)=>{
    const d=document.getElementById('pn-'+i);
    d.className='p-num'+(i===current?' active':i<current?' done':'');
  });
}

function loadQuestion(){
  document.getElementById('q-badge').textContent=`Question ${questions[current].id} of ${questions.length}`;
  document.getElementById('q-text-content').textContent=questions[current].text;
  document.getElementById('question-card').style.display='none';
  document.getElementById('reveal-btn').textContent='';
  document.getElementById('reveal-btn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> 질문 보기';
  revealed=false;
  document.getElementById('btn-prev').disabled=current===0;
  document.getElementById('btn-next').disabled=current===questions.length-1;
  document.getElementById('audio-progress').style.width='0%';
  updateProgress();
  const player=document.getElementById('player');
  player.src=questions[current].audio;
  player.load();
  player.play().catch(()=>{});
  player.ontimeupdate=()=>{
    if(player.duration){
      document.getElementById('audio-progress').style.width=(player.currentTime/player.duration*100)+'%';
    }
  };
  player.onended=()=>{ document.getElementById('audio-progress').style.width='100%'; };
}

function toggleQuestion(){
  revealed=!revealed;
  document.getElementById('question-card').style.display=revealed?'block':'none';
  document.getElementById('reveal-btn').innerHTML=revealed
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><line x1="1" y1="1" x2="23" y2="23"/></svg> 질문 숨기기'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> 질문 보기';
}

function replayAudio(){
  const p=document.getElementById('player');
  p.currentTime=0;
  p.play().catch(()=>{});
}

function startTest(){
  document.getElementById('start-screen').style.display='none';
  const ts=document.getElementById('test-screen');
  ts.style.display='flex';
  buildProgress();
  loadQuestion();
}

function nextQuestion(){ if(current<questions.length-1){current++;loadQuestion();} }
function prevQuestion(){ if(current>0){current--;loadQuestion();} }
</script>
